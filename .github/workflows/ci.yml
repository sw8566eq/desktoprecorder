name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Debian trixie, not bare ubuntu-latest: Cargo.toml pins libadwaita's
    # `v1_7` feature, but ubuntu-latest (24.04/noble) only carries
    # libadwaita 1.5 in its apt repos -- that build would fail on missing
    # symbols. trixie ships 1.7.6, matching this project's actual dev
    # environment (see CLAUDE.md) instead of chasing a newer Ubuntu
    # runner label.
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          # Keep this list in sync with README.md's Requirements section.
          # pulseaudio (the server, not just -utils) is CI-only: audio.rs's
          # tests shell out to a real `pactl get-default-sink` even at
          # build time (see CLAUDE.md), which needs something to actually
          # answer -- the dev box always has a session daemon running;
          # this container starts one of its own below.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-pipewire \
            libgtk-4-dev libadwaita-1-dev \
            pulseaudio pulseaudio-utils

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --verbose

      - name: Start PulseAudio
        run: |
          # --system: there's no login session in this container to
          # autospawn a per-user daemon, and this step runs as root --
          # --system is PulseAudio's own supported mode for exactly that
          # (a headless/container daemon, not tied to a session).
          #
          # The daemon itself now starts fine under --system, but its
          # default system.pa ACLs the native socket to the pulse-access
          # group -- root isn't a member (root can't even be, there's no
          # non-root user in this container to add), so the very first
          # `pactl` call failed with "Access denied". Loading our own
          # minimal config instead (-n --file=...), with
          # auth-anonymous=1, is the actual fix -- module-always-sink is
          # what makes get-default-sink resolve to a real (null) sink
          # with no hardware and no further setup.
          cat > /tmp/pulse-ci.pa <<'EOF'
          load-module module-always-sink
          load-module module-native-protocol-unix auth-anonymous=1
          EOF
          pulseaudio --system --daemonize=yes --disallow-exit=yes --exit-idle-time=-1 --log-target=stderr -n --file=/tmp/pulse-ci.pa
          sleep 2
          pactl info
          pactl get-default-sink

      - name: cargo test
        run: cargo test --verbose
        # No X11/display connection needed: by design, nothing in the
        # suite touches a live X server (see CLAUDE.md's Tests section) --
        # that assumption held here. PulseAudio is the one live service
        # some tests do need (audio.rs, see above), hence the step above
        # rather than skipping that coverage in CI.

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # cargo fmt --check is deliberately not run here yet: the existing
      # codebase predates rustfmt being applied and isn't currently
      # clean under its defaults. Reformatting is its own follow-up (it
      # touches every file) rather than something to bundle into CI setup.
